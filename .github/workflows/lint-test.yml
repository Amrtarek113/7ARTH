name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if (Test-Path "Dashboard Site/backend/requirements.txt") {
            pip install -r "Dashboard Site/backend/requirements.txt"
          }

      - name: Lint with flake8
        run: |
          flake8 "Dashboard Site/backend/app.py" --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 "Dashboard Site/backend/app.py" --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          if (Test-Path "Dashboard Site/backend/tests") {
            cd "Dashboard Site/backend"
            python -m pytest tests/ -v
          } else {
            echo "No tests directory found — skipping pytest"
          }
